syntax = "proto3";

package kodik;
import "kodik/common.proto";
option java_package = "bot.kodik.proto";
option java_multiple_files = true;

service CheckpointsService {
  rpc checkpointDiff(Int64Request) returns (Empty);
  rpc checkpointRestore(CheckpointRestoreRequest) returns (Empty);
  rpc getCheckpointFiles(Int64Request) returns (CheckpointFilesResponse);
  rpc openFileDiff(OpenFileDiffRequest) returns (Empty);
  rpc clearDiffDecorations(EmptyRequest) returns (Empty);
  rpc acceptFileChange(FileChangeActionRequest) returns (Empty);
  rpc rejectFileChange(FileChangeActionRequest) returns (Empty);
}

message OpenFileDiffRequest {
  Metadata metadata = 1;
  int64 checkpoint_ts = 2;
  string file_path = 3;
  optional string before_content = 4; // Optional: cached content before changes
  optional string after_content = 5; // Optional: cached content after changes
}

message CheckpointRestoreRequest {
  Metadata metadata = 1;
  int64 number = 2;
  string restore_type = 3;
  optional int64 offset = 4;
}

message CheckpointFilesResponse {
  Metadata metadata = 1;
  repeated CheckpointFile files = 2;
}

message CheckpointFile {
  string relative_path = 1;
  string absolute_path = 2;
  int32 lines_added = 3;
  int32 lines_removed = 4;
  string change_type = 5; // "added", "modified", "deleted"
  string before_content = 6; // File content before changes
  string after_content = 7; // File content after changes
}

message FileChangeActionRequest {
  Metadata metadata = 1;
  int64 checkpoint_ts = 2;
  string file_path = 3;
  string before_content = 4; // Content before changes (for restore)
  string after_content = 5; // Content after changes (for accept)
}
