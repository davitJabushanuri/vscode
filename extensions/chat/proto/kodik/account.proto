syntax = "proto3";

package kodik;
import "kodik/common.proto";
option java_package = "bot.kodik.proto";
option java_multiple_files = true;

// Service for account-related operations
service AccountService {
  // Handles the user clicking the login link in the UI.
  // Generates a secure nonce for state validation, stores it in secrets,
  // and opens the authentication URL in the external browser.
  rpc accountLoginClicked(EmptyRequest) returns (String);
    
  // Handles the user clicking the logout button in the UI.
  // Clears API keys and user state.
  rpc accountLogoutClicked(EmptyRequest) returns (Empty);

  // Subscribe to auth status update events (when authentication state changes)
  rpc subscribeToAuthStatusUpdate(EmptyRequest) 
      returns (stream AuthState);
    
  // Handles authentication state changes from the Firebase context.
  // Updates the user info in global state and returns the updated value.
  rpc authStateChanged(AuthStateChangedRequest) 
      returns (AuthState);
    
  // Fetches user usage data from /v1/consumer/usage/sessions
  rpc getUserUsage(GetUserUsageRequest) returns (UserUsageData);

  rpc openrouterAuthClicked(EmptyRequest) returns (Empty);
  
  rpc accountDirectLogin(DirectLoginRequest) returns (String);
  
  // OAuth flow methods
  rpc createOAuthAuthorizationUrl(OAuthProviderRequest) returns (OAuthAuthorizationResponse);
  
  rpc handleOAuthCallback(OAuthCallbackRequest) returns (String);
}

message AuthStateChangedRequest {
  Metadata metadata = 1;
  UserInfo user = 2;
}

message AuthState {
  optional UserInfo user = 1;
}

// User's information
message UserInfo {
  string uid = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string photo_url = 4;
  optional string app_base_url = 5; // Kodik app base URL
}

message UserUsageData {
  repeated UsageSession sessions = 1;
  PaginationInfo pagination = 2;
  UsageSummary summary = 3;
}

message GetUserUsageRequest {
  int32 page = 1;
  int32 per_page = 2;
}

message PaginationInfo {
  int32 page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message UsageSummary {
  int32 total_sessions = 1;
  int32 total_requests = 2;
  int32 total_tokens = 3;
  double total_cost = 4;
  int32 successful_requests = 5;
  int32 failed_requests = 6;
  repeated string models_used = 7;
}

message UsageSession {
  int32 id = 1;
  string date = 2;
  string model = 3;
  string kind = 4;
  int32 tokens = 5;
  int32 input_tokens = 6;
  int32 output_tokens = 7;
  int32 total_request = 8;
  double cost = 9;
  string status = 10;
  int32 response_time_ms = 11;
  int32 cached_tokens = 12;
}

message DirectLoginRequest {
  string email = 1;
  string password = 2;
  optional string company = 3;
  optional string action = 4;
}

message OAuthProviderRequest {
  string provider = 1; // "google" or "github"
  optional string source = 2; // "ide" or "landing_page" - defaults to "ide"
}

message OAuthAuthorizationResponse {
  string authorization_url = 1;
  string state = 2;
}

message OAuthCallbackRequest {
  string provider = 1; // "google" or "github"
  string code = 2;
  string state = 3;
}
